name: Update jobs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe_two_sigma.py
      - uses: actions/upload-artifact@v4
        with:
          name: two-sigma-public-fixtures
          path: .cache/two-sigma-*.html
          retention-days: 3
